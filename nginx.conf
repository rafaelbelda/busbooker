# ─────────────────────────────────────────────────────────────────
# busbooker — nginx reverse proxy + static frontend
#
# Install (first time):
#   cp busbooker /etc/nginx/sites-available/busbooker
#   ln -s /etc/nginx/sites-available/busbooker /etc/nginx/sites-enabled/busbooker
#   nginx -t && systemctl reload nginx
#
# After first setup, `git pull` + service restart is enough.
# Static files in front/ are served directly from disk — no nginx reload needed.
#
# NOTE: admin uses HTTP Basic Auth — add HTTPS (certbot) before exposing to strangers.
# ─────────────────────────────────────────────────────────────────

upstream busbooker {
    server 127.0.0.1:8771;
    keepalive 16;
}

server {
    listen 80;
    server_name busbooker.anarquia.me;

    # Global proxy settings (inherited by all proxy_pass locations below)
    proxy_read_timeout    120s;   # covers the ~90 s browser-driven flows
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_http_version    1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health: fast, suppress access log noise
    location = /health {
        access_log off;
        proxy_pass http://busbooker;
    }

    # API paths → uvicorn backend
    location ~* ^/(seats|search|reservations|scheduler|admin|docs|redoc|openapi\.json) {
        proxy_pass http://busbooker;
    }

    # Static frontend (everything else)
    # JS/CSS have no content hash in filenames — avoid caching to prevent stale assets.
    location / {
        root      /home/busbooker/front;
        index     index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires   0;
    }
}
