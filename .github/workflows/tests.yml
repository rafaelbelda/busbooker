name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The suite is hermetic — no Chromium, no network, no real reservations —
      # so `playwright install` is deliberately NOT run here. The playwright pip
      # package is enough to import; only a real flow needs the browser binary.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # conftest.py sets these too; pinned here so a CI misconfiguration
          # can never fall back to a real database path.
          ADMIN_PASSWORD: ci-test-password
          RESERVATION_DB: ":memory:"
        run: pytest
