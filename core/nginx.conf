# ─────────────────────────────────────────────────────────────────
# bus-reserver — minimal nginx reverse proxy → uvicorn (127.0.0.1:8000)
#
# Install:
#   cp core/nginx.conf /etc/nginx/sites-available/bus-reserver
#   ln -s /etc/nginx/sites-available/bus-reserver /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTP only — the operator terminates TLS separately (e.g. certbot adds a 443
# server block, or a TLS load balancer sits in front).
# ─────────────────────────────────────────────────────────────────

upstream bus_reserver {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Gzip JSON responses (browser flows return seat maps / records as JSON).
gzip on;
gzip_proxied any;
gzip_types application/json;
gzip_min_length 256;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Playwright flows can take up to ~90 s; allow headroom on both ends.
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Liveness probe — proxied but never logged (keeps access logs clean).
    location = /health {
        access_log off;
        proxy_pass http://bus_reserver;
    }

    location / {
        proxy_pass http://bus_reserver;
    }
}
